name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The starter ref these jobs install into. It is `main` and should stay
  # `main`: a plugin that stops installing because the starter moved is
  # precisely what they exist to catch, and pinning to anything older hides
  # it. The one exception is a paired change — see the `starter` job.
  FLAMA_AI_REF: main

jobs:
  # A plugin is generated from the starter, so a plugin change and the starter
  # change that makes room for it land together. Until the starter side is
  # merged, `main` still owns the feature and the plugin cannot install — the
  # round trip would be red for every paired pull request, which is exactly
  # when it is worth running.
  #
  # So: if a branch of this pull request's own name exists in the starter, that
  # is the other half of the pair, and the jobs install into it. The convention
  # is already how the two repos are worked. Nothing else resolves this way —
  # a push to `main` carries no head ref, and a pull request with no twin
  # branch falls back to `main`.
  starter:
    name: Resolve the starter ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - id: resolve
        env:
          FALLBACK: ${{ env.FLAMA_AI_REF }}
          PAIRED: ${{ github.head_ref }}
        run: |
          ref="$FALLBACK"
          if [ -n "$PAIRED" ] && git ls-remote --exit-code --heads \
              https://github.com/JordiParraCrespo/flama-ai.git "$PAIRED" >/dev/null 2>&1; then
            ref="$PAIRED"
            echo "Paired with flama-ai@$PAIRED."
          else
            echo "No paired branch in flama-ai; using $ref."
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  roundtrip:
    name: Round trip against flama-ai
    needs: starter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # A plugin only means anything inside a Flama repo, so the host is the
      # fixture.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: JordiParraCrespo/flama-ai
          ref: ${{ needs.starter.outputs.ref }}
          path: .flama-ai
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test scripts/*.test.mjs
      # A shared block's body is carried for projects that pruned its other
      # owners, and read out of the starter rather than written by hand. This
      # is what keeps the copy from drifting: it fails when the starter
      # rewords its block and the plugin still carries the old words.
      - name: Shared block bodies match the starter
        run: node scripts/shared-bodies.mjs --repo .flama-ai --check
      # Install each plugin, run the host repo's own checks with it in, remove
      # it, and require the tree to come back byte-identical — into the full
      # starter and into the pruned projects plugins actually land in.
      - name: Round trip
        run: node scripts/roundtrip.mjs --repo .flama-ai

  installed:
    name: Build and test an installed plugin
    needs: starter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: JordiParraCrespo/flama-ai
          ref: ${{ needs.starter.outputs.ref }}
          path: .flama-ai
      # The pnpm version is the starter's, read from its own packageManager
      # pin — this repo has no pnpm of its own to pin, and hard-coding one
      # here would drift from the workspace the plugin installs into.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: .flama-ai/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # The round trip proves a plugin installs; it does not prove the code it
      # installs compiles. Nothing else does either, now that `apps/cli` has
      # left the starter — so its build, tests and lint run here, against the
      # workspace it lands in.
      # An absolute path: `--from` resolves against the starter's root, not the
      # working directory, so that the same argument means the same thing from
      # anywhere in a project. `.` would name the starter checkout itself.
      - name: Install the plugin
        run: node .flama-ai/scripts/plugins/plugin.mjs add cli --from "$GITHUB_WORKSPACE"
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: .flama-ai
      # Two invocations, not `run build test`. The `test` task declares no
      # `dependsOn`, so in one graph turbo starts it immediately and vitest
      # resolves `@flama/shared` before its dist exists. The host's own CI
      # splits them for the same reason.
      - name: Build
        run: pnpm turbo run build --filter=@flama/cli...
        working-directory: .flama-ai
      - name: Test
        run: pnpm turbo run test --filter=@flama/cli
        working-directory: .flama-ai
      - name: Lint
        run: pnpm exec biome check apps/cli
        working-directory: .flama-ai
