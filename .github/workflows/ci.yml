name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The starter ref the round trip installs into. This must be `main`: a plugin
  # that stops installing because the starter moved is what this job exists to
  # catch, and pinning hides exactly that.
  #
  # It is a branch for now only because the installer itself is unmerged —
  # flama-ai#148 adds scripts/plugins/plugin.mjs, without which the round trip
  # cannot run at all. Set this back to `main` the moment that lands.
  FLAMA_AI_REF: claude/compassionate-curie-2jvnwz

jobs:
  roundtrip:
    name: Round trip against flama-ai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # A plugin only means anything inside a Flama repo, so the host is the
      # fixture.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: JordiParraCrespo/flama-ai
          ref: ${{ env.FLAMA_AI_REF }}
          path: .flama-ai
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test scripts/*.test.mjs
      # Install each plugin, run the host repo's own checks with it in, remove
      # it, and require the tree to come back byte-identical.
      - name: Round trip
        run: node scripts/roundtrip.mjs --repo .flama-ai

  installed:
    name: Build and test an installed plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: JordiParraCrespo/flama-ai
          ref: ${{ env.FLAMA_AI_REF }}
          path: .flama-ai
      # The pnpm version is the starter's, read from its own packageManager
      # pin — this repo has no pnpm of its own to pin, and hard-coding one
      # here would drift from the workspace the plugin installs into.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: .flama-ai/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # The round trip proves a plugin installs; it does not prove the code it
      # installs compiles. Nothing else does either, now that `apps/cli` has
      # left the starter — so its build, tests and lint run here, against the
      # workspace it lands in.
      - name: Install the plugin
        run: node .flama-ai/scripts/plugins/plugin.mjs add cli --from .
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: .flama-ai
      - name: Build and test
        run: pnpm turbo run build test --filter=@flama/cli
        working-directory: .flama-ai
      - name: Lint
        run: pnpm exec biome check apps/cli
        working-directory: .flama-ai
